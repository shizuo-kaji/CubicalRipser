[project]
name = "cripser"
version = "0.0.35"
description = "Cubical Ripser Python binding"
license = { file = "LICENSE" }
urls = { "Homepage" = "https://github.com/shizuo-kaji/CubicalRipser_3dim" }
keywords = ["persistent homology", "TDA", "cubical complex", "image", "volume"]
readme = "README.md"
authors = [
    { name = "Shizuo Kaji", email = "shizuo.kaji@gmail.com"}
    ]
requires-python = ">=3.9"

[build-system]
# setuptools reads metadata from [project]; setup.py drives CMake directly.
# cmake/ninja here lets isolated `pip` builds succeed even on fresh Windows hosts.
# nanobind is needed at build time so CMakeLists.txt can find_package(nanobind).
requires = [
  "setuptools>=69",
  "wheel",
  "cmake>=3.21",
  "ninja>=1.11",
  "nanobind>=2.0",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# 3.9–3.11 use version-specific wheels; wheels built for 3.12 use the abi3 tag and will be reused for 3.13+.
# nanobind requires Python 3.9 or higher; additionally, jobs for 3.13/3.14 are not required.
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*"]
skip = "pp* cp31?t-*"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
namespaces = true
include = ["cripser*"]
